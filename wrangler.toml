name = "momsbday"
main = "src/worker.js"
compatibility_date = "2026-11-01"
routes = [{ pattern = "momsbday.ackerworks.com", custom_domain = true }]

rules = [
  { type = "Text", globs = ["**/*.html", "**/*.css", "public/**/*.txt"], fallthrough = true },
  { type = "Data", globs = ["**/*.jpg", "**/*.png"], fallthrough = true },
]

[[services]]
binding = "SONG"
service = "momsbday-song"
